spring.application.name=career-builder
# ==============================
# = POSTGRESQL CONFIGURATION  =
# ==============================
server.port=9091

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/admindb
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Lazy connection initialization - don't fail on startup if DB unavailable
spring.datasource.hikari.initialization-fail-timeout=0

# JWT
app.jwt.secret=replace-with-32+char-super-secret-key-1234567890
app.jwt.expiration-ms=86400000

